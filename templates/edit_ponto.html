{% extends "base.html" %}

{% block content %}
<div class="dashboard-container">
    <div class="dashboard-header">
        <h2><i class="fa-solid fa-edit"></i> Editar Ponto de Recolha</h2>
        <a href="{{ url_for('admin_dashboard') }}" class="btn-outline"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
    </div>

    <div class="auth-container" style="max-width: 800px; margin: 2rem auto;">
        <form action="{{ url_for('edit_ponto', ponto_id=ponto.id) }}" method="post" enctype="multipart/form-data">
            <div id="map-preview" style="height: 300px; margin-bottom: 2rem;"></div>

            <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Nome do Local</label>
                    <input type="text" name="nome" value="{{ ponto.nome }}" required>
                </div>
                <div class="form-group">
                    <label>Tipo de Recolha</label>
                    <input type="text" name="tipo_recolha" value="{{ ponto.tipo_recolha }}">
                </div>
            </div>

            <div class="form-group">
                <label>Morada</label>
                <textarea name="morada" rows="2" required>{{ ponto.morada }}</textarea>
            </div>

            <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Horário</label>
                    <input type="text" name="horario" value="{{ ponto.horario }}">
                </div>
                <div class="form-group">
                    <label>Link Oficial</label>
                    <input type="text" name="link" value="{{ ponto.link }}">
                </div>
            </div>

            <div class="form-group">
                <label>Alterar Imagem (Opcional)</label>
                <input type="file" name="imagem" accept="image/*">
                {% if ponto.imagem %}
                <div style="margin-top: 10px;">
                    <p><small>Imagem atual:</small></p>
                    <img src="{{ url_for('serve_ponto_imagem', ponto_id=ponto.id) }}" alt="Imagem atual"
                        style="max-width: 200px; border-radius: 8px;">
                </div>
                {% endif %}
            </div>

            <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>Latitude</label>
                    <input type="number" step="any" id="latitude" name="latitude" value="{{ ponto.latitude }}" readonly
                        required>
                </div>
                <div class="form-group">
                    <label>Longitude</label>
                    <input type="number" step="any" id="longitude" name="longitude" value="{{ ponto.longitude }}"
                        readonly required>
                </div>
            </div>

            <button type="submit" class="full-width-btn">Guardar Alterações</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const map = L.map('map-preview').setView([{{ ponto.latitude }}, { { ponto.longitude } }], 15);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    var redIcon = new L.Icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });

    let marker = L.marker([{{ ponto.latitude }}, { { ponto.longitude } }], { draggable: true, icon: redIcon }).addTo(map);

    map.on('click', function (e) {
        const { lat, lng } = e.latlng;
        marker.setLatLng([lat, lng]);
        document.getElementById('latitude').value = lat.toFixed(6);
        document.getElementById('longitude').value = lng.toFixed(6);
    });

    marker.on('move', e => {
        document.getElementById('latitude').value = e.latlng.lat.toFixed(6);
        document.getElementById('longitude').value = e.latlng.lng.toFixed(6);
    });
</script>
{% endblock %}
