{% extends "base.html" %}

{% block content %}
<header class="page-header">
    <h1>Contacto</h1>
    <p>Dúvidas ou sugestões? Fale connosco e ajude Lisboa a ser mais sustentável.</p>
</header>

<main class="dashboard-container" style="max-width: 720px;">
    <div class="card">
        <form id="contactForm">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Seu nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail de Contacto</label>
                <input type="email" id="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="assunto">Assunto</label>
                <input type="text" id="assunto" required placeholder="Sobre o que deseja falar?">
            </div>

            <div class="form-group">
                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" required rows="5" placeholder="Escreva aqui sua mensagem..."></textarea>
            </div>

            <button type="submit" class="full-width-btn">Enviar Mensagem</button>
        </form>
    </div>
</main>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById("contactForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const nome = document.getElementById("nome").value;
        const email = document.getElementById("email").value;
        const assunto = document.getElementById("assunto").value;
        const mensagem = document.getElementById("mensagem").value;

        const mailtoLink = `mailto:elixozero.lisboa@gmail.com?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(
            `Nome: ${nome}
Email: ${email}

Mensagem:
${mensagem}`)}`;

        window.location.href = mailtoLink;
    });
</script>
{% endblock %}
