{% extends "base.html" %}

{% block head %}
{% endblock %}

{% block content %}
<div id="map-container">
    <div id="map"></div>

    <!-- Legenda ou Filtros flutuantes (Opcional) -->
    <div class="map-overlay">
        <h3>Legenda</h3>
        <p><i class="fa-solid fa-location-dot" style="color: #2e7d32;"></i> Pontos de Recolha</p>
        <p><small>Clique nos clusters para expandir.</small></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Inicializa o mapa
    const map = L.map('map').setView([38.7223, -9.1393], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // PONTOS do Flask
    const pontos = {{ pontos | tojson | safe }};

    // Grupo de clusters
    const markers = L.markerClusterGroup();

    // Adiciona pontos do backend
    pontos.forEach(ponto => {
        let imgHTML = '';
        if (ponto.tem_imagem) {
            const imgPath = `/ponto_imagem/${ponto.id}`;
            imgHTML = `<img src="${imgPath}" alt="Imagem do local">`;
        }

        const popupHTML = `
            <div class="popup-card">
                ${imgHTML}
                <h3>${ponto.nome}</h3>
                <p><i class="fa-solid fa-map-pin"></i> ${ponto.morada}</p>
                <p><i class="fa-regular fa-clock"></i> ${ponto.horario || 'N/D'}</p>
                <p><i class="fa-solid fa-recycle"></i> ${ponto.tipo_recolha || 'N/D'}</p>
                ${ponto.link ? `<a href="${ponto.link}" target="_blank" class="btn-outline" style="display:inline-block; margin-top:5px; padding: 5px 10px; font-size: 0.8rem;">Ver Mais</a>` : ''}
            </div>
        `;
        const marker = L.marker([ponto.latitude, ponto.longitude]);
        marker.bindPopup(popupHTML);
        markers.addLayer(marker);
    });

    map.addLayer(markers);
</script>
{% endblock %}
