{% extends "base.html" %}

{% block head %}{% endblock %}

{% block content %}
<div id="map-container">
    <div id="map"></div>

    <div class="map-overlay">
        <h3><i class="fa-solid fa-recycle"></i> Legenda</h3>
        <p><span
                style="display:inline-block;width:14px;height:14px;background:var(--primary-color);border-radius:50%;margin-right:4px;vertical-align:middle;"></span>
            Pontos de Recolha</p>
        <p style="font-size:.75rem; color:var(--text-light);">Clique nos clusters para expandir.</p>
        <hr style="border:none; border-top:1px solid rgba(128,0,32,.15); margin:.6rem 0;">
        <button id="btnMaisProximo" onclick="encontrarMaisProximo()"
            style="width:100%; padding:9px 12px; background:var(--primary-gradient); color:white; border:none; border-radius:var(--radius-md); cursor:pointer; font-size:.85rem; font-weight:700; display:flex; align-items:center; gap:7px; justify-content:center; box-shadow:var(--shadow-wine); transition:var(--transition);">
            <i class="fa-solid fa-location-crosshairs"></i> Ponto mais perto
        </button>
        <div id="maisProximoMsg"
            style="margin-top:7px; font-size:.78rem; color:var(--text-light); display:none; line-height:1.4;"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // ── Ícone SVG Wine Red ────────────────────────────────────
    function criarIcone(cor) {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 41" width="26" height="41">
            <defs>
                <linearGradient id="g${cor.replace('#', '')}" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="${cor}" stop-opacity="1"/>
                    <stop offset="100%" stop-color="#3d0010" stop-opacity="1"/>
                </linearGradient>
            </defs>
            <path fill="url(#g${cor.replace('#', '')})" stroke="#3d0010" stroke-width="1"
                d="M13 0C5.8 0 0 5.8 0 13c0 9.8 13 28 13 28s13-18.2 13-28C26 5.8 20.2 0 13 0z"/>
            <circle cx="13" cy="13" r="5.5" fill="rgba(255,255,255,0.9)"/>
        </svg>`;
        return L.divIcon({
            html: svg,
            className: '',
            iconSize: [26, 41],
            iconAnchor: [13, 41],
            popupAnchor: [0, -38]
        });
    }

    const wineIcon = criarIcone('#800020');

    // ── Mapa ──────────────────────────────────────────────────
    const map = L.map('map', { zoomControl: true }).setView([38.7223, -9.1393], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    const pontos = {{ pontos | tojson | safe }};
    const markers = L.markerClusterGroup({ maxClusterRadius: 60 });
    const markerMap = {};

    pontos.forEach(ponto => {
        let imgHTML = ponto.tem_imagem
            ? `<img src="/ponto_imagem/${ponto.id}" alt="Imagem do local">`
            : '';

        const popupHTML = `
            <div class="popup-card">
                ${imgHTML}
                <h3>${ponto.nome}</h3>
                <p><i class="fa-solid fa-map-pin" style="color:var(--primary-color)"></i> ${ponto.morada}</p>
                <p><i class="fa-regular fa-clock" style="color:var(--primary-color)"></i> ${ponto.horario || 'N/D'}</p>
                <p><i class="fa-solid fa-recycle" style="color:var(--primary-color)"></i> ${ponto.tipo_recolha || 'N/D'}</p>
                ${ponto.link ? `<a href="${ponto.link}" target="_blank" class="btn-outline" style="margin-top:6px; padding:4px 10px; font-size:.78rem;">Ver Mais</a>` : ''}
            </div>`;

        const marker = L.marker([ponto.latitude, ponto.longitude], { icon: wineIcon });
        marker.bindPopup(popupHTML);
        markers.addLayer(marker);
        markerMap[ponto.id] = { marker, ponto };
    });

    map.addLayer(markers);

    // ── Navegar para ponto vindo da Pesquisa ─────────────────
    const urlParams = new URLSearchParams(window.location.search);
    const targetLat = parseFloat(urlParams.get('lat'));
    const targetLng = parseFloat(urlParams.get('lng'));
    const targetId = parseInt(urlParams.get('id'));

    if (!isNaN(targetLat) && !isNaN(targetLng)) {
        map.flyTo([targetLat, targetLng], 17, { duration: 1.2 });
        if (!isNaN(targetId) && markerMap[targetId]) {
            setTimeout(() => {
                markers.zoomToShowLayer(markerMap[targetId].marker, () => {
                    markerMap[targetId].marker.openPopup();
                });
            }, 1400);
        }
    }

    // ── Ponto mais próximo ───────────────────────────────────
    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dL = (lat2 - lat1) * Math.PI / 180;
        const dLn = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dL / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLn / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function encontrarMaisProximo() {
        const btn = document.getElementById('btnMaisProximo');
        const msg = document.getElementById('maisProximoMsg');

        if (!navigator.geolocation) {
            msg.style.display = 'block';
            msg.innerHTML = '<i class="fa-solid fa-circle-exclamation" style="color:#dc2626"></i> Geolocalização não suportada.';
            return;
        }

        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> A localizar...';
        btn.disabled = true;
        msg.style.display = 'none';

        navigator.geolocation.getCurrentPosition(pos => {
            const uLat = pos.coords.latitude, uLng = pos.coords.longitude;

            // Marcador do utilizador
            L.circleMarker([uLat, uLng], {
                radius: 9, fillColor: '#3b82f6', color: '#1d4ed8',
                weight: 2, opacity: 1, fillOpacity: .85
            }).addTo(map).bindPopup('<b>📍 A sua localização</b>').openPopup();

            // Ponto mais próximo
            let melhor = null, menorDist = Infinity;
            pontos.forEach(p => {
                const d = haversine(uLat, uLng, p.latitude, p.longitude);
                if (d < menorDist) { menorDist = d; melhor = p; }
            });

            if (melhor && markerMap[melhor.id]) {
                map.flyTo([melhor.latitude, melhor.longitude], 17, { duration: 1.4 });
                setTimeout(() => {
                    markers.zoomToShowLayer(markerMap[melhor.id].marker, () => {
                        markerMap[melhor.id].marker.openPopup();
                    });
                }, 1500);

                const distStr = menorDist < 1
                    ? `${(menorDist * 1000).toFixed(0)}m`
                    : `${menorDist.toFixed(1)}km`;
                msg.style.display = 'block';
                msg.innerHTML = `<i class="fa-solid fa-check" style="color:#22c55e"></i> <b>${melhor.nome}</b><br>📏 ${distStr} de distância`;
            }

            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> Ponto mais perto';
            btn.disabled = false;
        }, () => {
            msg.style.display = 'block';
            msg.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b"></i> Não foi possível obter a localização.';
            btn.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i> Ponto mais perto';
            btn.disabled = false;
        }, { timeout: 10000, enableHighAccuracy: true });
    }
</script>
{% endblock %}
