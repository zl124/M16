{% extends "base.html" %}

{% block content %}
<div class="auth-container">
  <h2><i class="fa-solid fa-user-plus"></i> Criar Conta</h2>

  <form method="post">
    <div class="form-group">
      <label for="name">Nome Completo</label>
      <input type="text" id="name" name="name" required placeholder="João Silva">
    </div>

    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required placeholder="seu@email.com">
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
    </div>

    <button type="submit" class="full-width-btn">Criar Conta</button>
  </form>

  <div class="auth-links">
    <p>Já tem conta? <a href="{{ url_for('login') }}">Faça login</a>.</p>
  </div>
</div>
{% endblock %}
